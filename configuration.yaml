# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 172.30.33.0/24

housevoice_walkie:

template:
  - light:
      - name: "Cora's Bedroom Light"
        unique_id: "cora_bedroom_light"
        state: "{{ is_state('input_boolean.small_bedroom_light', 'on') }}"
        level: "{{ (float(states('input_number.housevoice_small_bedroom_brightness')) * 2.55) | int }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.small_bedroom_light
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.small_bedroom_light
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.housevoice_small_bedroom_brightness
            data:
              value: "{{ (brightness / 2.55) | int }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.small_bedroom_light
      - name: "Primary Bedroom Light"
        unique_id: "primary_bedroom_light"
        state: "{{ is_state('input_boolean.primary_bedroom_light', 'on') }}"
        level: "{{ (float(states('input_number.housevoice_primary_bedroom_brightness')) * 2.55) | int }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.primary_bedroom_light
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.primary_bedroom_light
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.housevoice_primary_bedroom_brightness
            data:
              value: "{{ (brightness / 2.55) | int }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.primary_bedroom_light
  - binary_sensor:
      - name: "HouseVoice Any Camera Motion"
        unique_id: "housevoice_any_camera_motion"
        state: >
          {{ is_state('binary_sensor.front_door_motion', 'on')
             or is_state('binary_sensor.driveway_motion', 'on')
             or is_state('binary_sensor.back_yard_motion', 'on')
             or is_state('binary_sensor.culdesac_view_motion', 'on')
            or is_state('binary_sensor.side_yard_motion', 'on') }}
        device_class: motion
  - triggers:
      - trigger: time_pattern
        seconds: "/1"
    sensor:
      - name: "HouseVoice Timer Tick"
        unique_id: "housevoice_timer_tick"
        state: "{{ now().timestamp() | int }}"

# HouseVoice Panel Presence System
# FUTURE HARDWARE REPLACEMENT:
# input_boolean.housevoice_panel_mock_presence
# becomes binary_sensor.real_panel_presence
input_boolean:
  housevoice_panel_mock_presence:
    name: "HouseVoice Panel Mock Presence"
    icon: mdi:motion-sensor
  housevoice_panel_awake:
    name: "HouseVoice Panel Awake"
    icon: mdi:monitor-eye
  housevoice_panel_manual_hold:
    name: "HouseVoice Panel Manual Hold"
    icon: mdi:hand-back-right-outline
  housevoice_climate_schedule_enabled:
    name: "HouseVoice Climate Schedule Enabled"
    icon: mdi:calendar-clock
  housevoice_climate_manual_hold:
    name: "HouseVoice Climate Manual Hold"
    icon: mdi:hand-back-right-outline
  housevoice_climate_sync_guard:
    name: "HouseVoice Climate Synchronization Guard"
    icon: mdi:sync-lock
  housevoice_climate_would_change:
    name: "HouseVoice Climate Would Change Thermostat"
    icon: mdi:thermostat-alert

input_select:
  housevoice_clock_brightness:
    name: "HouseVoice Clock Brightness"
    options:
      - "Low"
      - "Medium"
      - "High"
    initial: "Medium"
    icon: mdi:brightness-6

input_number:
  housevoice_timer_minutes:
    name: "HouseVoice Timer Minutes"
    initial: 1
    min: 0
    max: 59
    step: 1
    mode: box
  housevoice_timer_seconds:
    name: "HouseVoice Timer Seconds"
    initial: 0
    min: 0
    max: 59
    step: 1
    mode: box
  housevoice_small_bedroom_brightness:
    name: "Small Bedroom Light Brightness"
    initial: 20
    min: 0
    max: 100
    step: 1
    mode: slider
  housevoice_right_bedroom_brightness:
    name: "Right Bedroom Light Brightness"
    initial: 20
    min: 0
    max: 100
    step: 1
    mode: slider
  housevoice_primary_bedroom_brightness:
    name: "Primary Bedroom Light Brightness"
    initial: 100
    min: 0
    max: 100
    step: 1
    mode: slider
  housevoice_climate_morning_heat:
    name: "HouseVoice Climate Morning Heat"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_morning_cool:
    name: "HouseVoice Climate Morning Cool"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_day_heat:
    name: "HouseVoice Climate Day Heat"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_day_cool:
    name: "HouseVoice Climate Day Cool"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_evening_heat:
    name: "HouseVoice Climate Evening Heat"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_evening_cool:
    name: "HouseVoice Climate Evening Cool"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_sleep_heat:
    name: "HouseVoice Climate Sleep Heat"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_sleep_cool:
    name: "HouseVoice Climate Sleep Cool"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"
  housevoice_climate_hold_target:
    name: "HouseVoice Climate Held Target"
    min: 50
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "°F"

input_datetime:
  housevoice_climate_hold_expires:
    name: "HouseVoice Climate Hold Expires"
    has_date: true
    has_time: true
    icon: mdi:timer-sand-complete

input_text:
  housevoice_climate_active_period:
    name: "HouseVoice Climate Active Period"
    max: 32
    icon: mdi:calendar-range
  housevoice_climate_scheduled_target:
    name: "HouseVoice Climate Scheduled Target"
    max: 32
    icon: mdi:thermometer-check
  housevoice_climate_recommended_target:
    name: "HouseVoice Climate Recommended Target"
    max: 32
    icon: mdi:thermometer-chevron-up
  housevoice_climate_effective_reason:
    name: "HouseVoice Climate Effective Reason"
    max: 32
    icon: mdi:information-outline
  housevoice_climate_explanation:
    name: "HouseVoice Climate Explanation"
    max: 255
    icon: mdi:text-box-outline

timer:
  housevoice_panel_standby:
    name: "HouseVoice Panel Standby Timer"
    duration: "00:04:00"
    restore: true
  housevoice_kids_timer:
    name: "HouseVoice Kids Timer"
    duration: "00:01:00"
    restore: true
