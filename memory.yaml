  - date: "2026-07-21"
    session: "climate-control-buttons-fix"
    summary: >
      Diagnosed and fixed button tap_actions on Climate Control view. Root cause:
      all 9 interactive buttons used action:javascript with hass.callService() syntax,
      which requires button-card v5.0+ official support. While bundled button-card
      appears to be v5.0+ (has perform-action keyword), the javascript action was
      unreliable. Converted all 9 buttons from action:javascript to action:call-service
      with proper service/data fields. Buttons: COOL/IDLE/HEAT → input_select.select_option
      on hvac_mode; AUTO/ON/CIRCULATE → input_select.select_option on fan_mode;
      sp-minus → input_number.decrement; sp-plus → input_number.increment;
      ECO → input_boolean.toggle. Deployed successfully via hab dashboard view update.
      All 0 javascript actions remain, 9 call-service actions active.

  - date: "2026-07-21"
    session: "climate-control-dynamic"
    summary: >
      Major dynamic update to Climate Control view. Merged 3 separate setpoint
      cards (sp-minus, sp-value, sp-plus) into single unified card with
      grid-template-areas "minus value plus" for horizontal [−] [SET TO 66°] [+]
      layout. Grid areas updated: "setpoint setpoint" replaces 3 sp-* areas.
      Made dial dynamic: reads input_number.indoor_temperature and
      input_select.hvac_mode via JS templates, updates arc color (blue=cooling,
      amber=heating, gray=idle), temperature text, and mode label. Made top badge
      dynamic with template icon/name/color. Added entity + state-based styling
      to COOL/IDLE/HEAT (highlight selected mode), AUTO/ON/CIRCULATE fan buttons,
      and ECO MODE (dynamic label OFF/ACTIVE, green glow when on). Made status
      message template-driven.       All tap_actions use call-service. Deployed via
      hab dashboard view update. View now has 17 cards (was 20), all interactive.

