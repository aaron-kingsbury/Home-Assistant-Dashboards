# Memory tracking file for OpenCode sessions.
# Each session should append a summary entry here before signing off.
# Read this file at the start of every session for continuity.

memories:
  - date: "2026-07-18"
    session: "initial"
    summary: >
      First session. User asked to set up a memory tracking system:
      check for an existing memory.yaml, create one if absent, and add
      an instruction to AGENTS.md to read/append to memory.yaml each session.
      Created /homeassistant/memory.yaml with this memories list. Edited
      /homeassistant/AGENTS.md to add a Memory Continuity section. No HA
