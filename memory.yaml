  - date: "2026-08-02"
    session: "panel-presence-system"
    summary: >
      Built a mock panel-presence system for a future 10.1-inch PoE touchscreen
      (HouseVoice panel). Reusable Browser Mod navigation scripts with a single
      placeholder browser_id (housevoice-hall-panel) to swap when the real panel
      registers. Added to configuration.yaml: 3 input_boolean helpers
      (housevoice_panel_mock_presence, housevoice_panel_awake,
      housevoice_panel_manual_hold) + timer.housevoice_panel_standby (4 min,
      restore true). Added 7 scripts to scripts.yaml: wake (cancel timer, awake on,
      navigate /my-floorplan), sleep (gated on manual_hold off + presence off,
      navigate /housevoice-standby/Standby, awake off), start/cancel countdown,
      and screen_on/dim/off placeholders (empty, no invented hardware services).
      Added 3 automations: presence manager (presence on -> cancel+wake, presence
      off -> start countdown), standby timer finished -> sleep script, manual hold
      manager (hold on -> cancel, hold off -> start). Existing 8 automations
      preserved. All 6 tests passed (wake, countdown start, cancel, timer->sleep,
      manual hold suppresses sleep, releasing hold restarts countdown). Rollback
      checkpoints in /config/backups/ (before/after-panel-presence). Dev card at
      /config/www/floorplan/panel_dev_card.yaml (NOT on any dashboard). Future
      swaps: mock_presence helper -> real binary_sensor; housevoice-hall-panel ->
      real browser_id; screen scripts -> real hardware.
