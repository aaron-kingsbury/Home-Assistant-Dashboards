  - date: "2026-07-18"
    session: "floorplan-dashboard"
    summary: >
      Built a floorplan dashboard for the user's house. Used ChatGPT to
      analyze the floorplan image (1448x1086px) and get bedroom positions.
      Created 3 input_boolean helpers for virtual bedroom lights:
      primary_bedroom_light, small_bedroom_light, right_bedroom_light.
      Created a "Floorplan" dashboard (url_path: my-floorplan) with a
      picture-elements card showing /local/floorplan/floorplan.png as the
      background. Placed mdi:ceiling-light state-icons at the center of
      each bedroom with tap-to-toggle and state-labels below. The user
      has no real light entities yet — these are placeholders to swap in
      later.       Screenshot tool was disabled so we could not visually verify.
      Iterated on icon styling: off-state icons use mdi:circle-outline
      + mdi:ceiling-light (white on white). On-state uses bright yellow
      state-icon with drop-shadow glow. Added a "All Lights" button-card
      to the left via horizontal-stack. Learned that button-card styles
      must be objects not quoted strings, and state-icon ignores CSS
      color overrides (use plain icon type for custom colors). Dashboard
      url: /lovelace/my-floorplan.
      Replaced stacked mdi:circle-outline + mdi:ceiling-light approach
      with custom:button-card elements inside picture-elements. Each light
      is now a single 42x42px circular button-card with template expressions
      for dynamic border/icon/glow based on entity state. Much cleaner result.
      Key lesson: button-card styles must use arrays of objects (not plain
      objects) to produce YAML list format, and template expressions like
      [[[return ...]]] work for dynamic CSS values.       Floorplan dashboard restructured to a single full-width picture-elements
      card (no horizontal-stack/vertical-stack wrappers). The floorplan image
      is used once as the card's main image. All buttons (All Lights + 3
      bedrooms) are positioned directly on it using percentage coordinates.
      All Lights button at 8.5%/22% with z-index:10 (on lawn, inside image), Primary at 24.1%/21.6%, Small at 58.5%/69.5%,
      Right at 72.1%/69.5%. Buttons 38px (bedrooms) and 110x122px (All Lights).

      Full sidebar built inside the single picture-elements card. Sidebar
      occupies left ~19% of the image with dark gradient background. Contains:
      - HouseVoice logo (image element at 10%/10%)
      - Nav items: Home (active), Lights, Locks, Cameras, Climate, Automations, Settings
      - Quick Controls section: All Lights, Front Door, Garage, Back Door tiles
      - Family section: 4 person placeholders
      - Night Mode pill at bottom
      All sidebar elements use action:none (placeholders). Original standalone
      All Lights button removed (replaced by sidebar Quick Controls tiles).
      YAML anchors were expanded to full JSON since card.json is not YAML.
      Logo expected at /config/www/housevoice/logo.svg.

      SIDEBAR v2: Rebuilt sidebar with wider dimensions to fix collapse issues.
      Sidebar 22% wide, nav items 18% wide, quick-control tiles 8%.
      Logo path corrected to /local/housevoice/logo.svg.
      Family and Night Mode sections removed temporarily (to be re-added after
      core layout confirmed).       Quick Controls use 2x2 grid at 6.6%/15.4% columns.

      SIDEBAR v3 (layout-card): Completely restructured dashboard to use
      custom:layout-card with CSS Grid layout. Sidebar is now a separate
      fixed 260px column (vertical-stack), floorplan fills remaining space.
      Installed custom:layout-card from thomasloven/lovelace-layout-card
      and card-mod from thomasloven/lovelace-card-mod.
      Files: /homeassistant/www/community/layout-card/layout-card.js
             /homeassistant/www/community/card-mod/card-mod.js
      Dashboard card is now type: custom:layout-card with grid-template-columns:
      260px minmax(0, 1fr). Sidebar contains: logo, Home nav (active), 6 nav
      items, QUICK CONTROLS section with 2x2 grid (All Lights, Front Door,
      Garage, Back Door). Floorplan card only contains the 3 bedroom light
      buttons. card_mod used for sidebar background gradient and styling.
      Resources may need manual registration in HA UI if not auto-discovered.

      CORRECTION: Resource URLs must use /local/ prefix, not bare /community/.
      Correct: /local/community/layout-card/layout-card.js
      Correct: /local/community/card-mod/card-mod.js
      Wrong: /community/layout-card/layout-card.js
      Wrong: /community/card-mod/card-mod.js
      Files under /config/www are served by HA under /local/. Register as
      "JavaScript Module" resource type in Settings → Dashboards → Resources.
      Also: manually downloaded JS from master branch rather than HACS. HACS
      is safer as it auto-registers and updates resources.

