    mon_date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=1)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d')
      }}"
    sat_date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=6)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d')
      }}"
    sun_date:
      "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=states('input_number.calendar_week_offset')
      | int(0) * 7)).strftime('%Y-%m-%d') }}"
    thu_date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=4)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d')
      }}"
    today_date: "{{ now().strftime('%Y-%m-%d') }}"
    tue_date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=2)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d')
      }}"
    wed_date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=3)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d')
      }}"
    next_week_end: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=13)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d')
      }}"
    next_week_start: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) +
      timedelta(days=7) + timedelta(days=states('input_number.calendar_week_offset')
      | int(0) * 7)).strftime('%Y-%m-%d') }}"
    week_end: "{{ today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=14)
      + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)
      }}"
    week_start:
      "{{ today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=states('input_number.calendar_week_offset')
      | int(0) * 7) }}"
- id: cora_music_volume_device_to_ma
  alias: Cora Music Volume - Device to Music Assistant
  description: Sync Cora's physical device volume to Music Assistant
  triggers:
    - trigger: state
      entity_id: number.vaca_c958413a0_music_volume
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable']
        and (trigger.to_state.state | int(0)) != ((state_attr('media_player.cora_s_room_display_media_player',
        'volume_level') | float(0) * 15) | round(0) | int) }}"
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.cora_s_room_display_media_player
      data:
        volume_level: "{{ (trigger.to_state.state | float(0) / 15) | round(2) }}"
- id: cora_music_volume_ma_to_device
  alias: Cora Music Volume - Music Assistant to Device
  description: Sync Music Assistant volume changes to Cora's physical device
  triggers:
    - trigger: state
      entity_id: media_player.cora_s_room_display_media_player
      attribute: volume_level
  conditions:
    - condition: template
      value_template:
        "{{ trigger.to_state.attributes.volume_level is not none and ((trigger.to_state.attributes.volume_level
        | float(0) * 15) | round(0) | int) != (states('number.vaca_c958413a0_music_volume')
        | int(0)) }}"
  actions:
    - action: number.set_value
      target:
        entity_id: number.vaca_c958413a0_music_volume
      data:
        value: "{{ (trigger.to_state.attributes.volume_level | float(0) * 15) | round(0)
          }}"
- id: ring_keypad_alarmo_control
  alias: Ring Keypad - Alarmo Control
  description: Route Ring Keypad v2 Entry Control events to Alarmo
  mode: queued
  max: 10
  triggers:
    - trigger: event
      event_type: zwave_js_notification
      event_data:
        device_id: 1f850216354ed6c00d80cf479ba18c6b
        node_id: 3
        command_class: 111
        command_class_name: Entry Control
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.event_type | int(-1) == 3 }}"
          sequence:
            - action: alarm_control_panel.alarm_disarm
              target:
                entity_id: alarm_control_panel.alarmo
              data:
                code: "{{ trigger.event.data.event_data }}"
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.event_type | int(-1) == 5 }}"
          sequence:
            - action: alarm_control_panel.alarm_arm_away
              target:
                entity_id: alarm_control_panel.alarmo
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.event_type | int(-1) == 6 }}"
          sequence:
            - action: alarm_control_panel.alarm_arm_home
              target:
                entity_id: alarm_control_panel.alarmo
- id: alarmo_ring_keypad_status_feedback
  alias: Alarmo - Ring Keypad Status Feedback
  description: Sync Ring Keypad mode indicators with the Alarmo state
  mode: restart
  triggers:
    - trigger: state
      entity_id: alarm_control_panel.alarmo
      to:
        - disarmed
        - armed_home
        - armed_away
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: disarmed
          sequence:
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_armed_stay_multilevel
                  - number.ring_keypad_armed_away_multilevel
              data:
                value: 0
            - action: number.set_value
              target:
                entity_id: number.ring_keypad_not_armed_disarmed_multilevel
              data:
                value: 100
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: armed_home
          sequence:
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_not_armed_disarmed_multilevel
                  - number.ring_keypad_armed_away_multilevel
              data:
                value: 0
            - action: number.set_value
              target:
                entity_id: number.ring_keypad_armed_stay_multilevel
              data:
                value: 100
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: armed_away
          sequence:
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_not_armed_disarmed_multilevel
                  - number.ring_keypad_armed_stay_multilevel
              data:
                value: 0
            - action: number.set_value
              target:
                entity_id: number.ring_keypad_armed_away_multilevel
              data:
                value: 100
- id: ring_keypad_proximity_brightness
  alias: Ring Keypad - Proximity Brightness
  description: Wake and dim Ring Keypad brightness without affecting alarm indicators
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.ring_keypad_motion_detection
      to: "on"
      id: motion_detected
    - trigger: state
      entity_id: binary_sensor.ring_keypad_motion_detection
      to: "off"
      for: 00:00:25
      id: motion_clear
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: motion_detected
          sequence:
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_brightness_key_backlight
              data:
                value: 80
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_brightness_security_mode
              data:
                value: 60
        - conditions:
            - condition: trigger
              id: motion_clear
          sequence:
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_brightness_key_backlight
              data:
                value: 0
            - action: number.set_value
              target:
                entity_id:
                  - number.ring_keypad_brightness_security_mode
              data:
                value: 10
- id: ring_keypad_invalid_disarm_feedback
  alias: Ring Keypad - Invalid Disarm Feedback
  description: Show a brief native rejection indication after an invalid Alarmo PIN
  mode: restart
  triggers:
    - trigger: event
      event_type: alarmo_failed_to_arm
      event_data:
        entity_id: alarm_control_panel.alarmo
        command: disarm
        reason: invalid_code
  actions:
    - action: number.set_value
      target:
        entity_id: number.ring_keypad_code_not_accepted_multilevel
      data:
        value: 100
    - delay: 00:00:03
    - action: number.set_value
      target:
        entity_id: number.ring_keypad_code_not_accepted_multilevel
      data:
        value: 0
- id: thermostat_fan_dashboard_to_real
  alias: Thermostat Fan Mode - Dashboard to Real
  description: Sync fan mode from dashboard controls to the Honeywell T6 Pro
  triggers:
    - trigger: state
      entity_id: input_select.fan_mode
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.fan_mode
              state: Auto
          sequence:
            - action: climate.set_fan_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                fan_mode: Auto low
        - conditions:
            - condition: state
              entity_id: input_select.fan_mode
              state: "On"
          sequence:
            - action: climate.set_fan_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                fan_mode: Low
        - conditions:
            - condition: state
              entity_id: input_select.fan_mode
              state: Circulate
          sequence:
            - action: climate.set_fan_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                fan_mode: Circulation
- id: thermostat_fan_real_to_dashboard
  alias: Thermostat Fan Mode - Real to Dashboard
  description: Sync Honeywell T6 Pro fan mode changes back to dashboard controls
  triggers:
    - trigger: state
      entity_id: climate.t6_pro_z_wave_programmable_thermostat
      attribute: fan_mode
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.fan_mode == 'Auto low' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.fan_mode
              data:
                option: Auto
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.fan_mode == 'Low' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.fan_mode
              data:
                option: "On"
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.fan_mode == 'Circulation'
                }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.fan_mode
              data:
                option: Circulate
- id: thermostat_eco_dashboard_to_real
  alias: Thermostat Eco Mode - Dashboard to Real
  description: Sync Eco Mode from the dashboard to the Honeywell T6 Pro preset
  triggers:
    - trigger: state
      entity_id: input_boolean.eco_mode
    - trigger: state
      entity_id: climate.t6_pro_z_wave_programmable_thermostat
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.eco_mode
              state: "on"
            - condition: state
              entity_id: climate.t6_pro_z_wave_programmable_thermostat
              state: cool
          sequence:
            - action: climate.set_preset_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                preset_mode: Energy cool
        - conditions:
            - condition: state
              entity_id: input_boolean.eco_mode
              state: "on"
            - condition: state
              entity_id: climate.t6_pro_z_wave_programmable_thermostat
              state: heat
          sequence:
            - action: climate.set_preset_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                preset_mode: Energy heat
      default:
        - action: climate.set_preset_mode
          target:
            entity_id: climate.t6_pro_z_wave_programmable_thermostat
          data:
            preset_mode: none
- id: thermostat_eco_real_to_dashboard
  alias: Thermostat Eco Mode - Real to Dashboard
  description: Sync Honeywell T6 Pro Eco preset changes back to the dashboard
  triggers:
    - trigger: state
      entity_id: climate.t6_pro_z_wave_programmable_thermostat
      attribute: preset_mode
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.preset_mode in ['Energy cool',
                'Energy heat'] }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.eco_mode
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.attributes.preset_mode == 'none' }}"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.eco_mode
- id: e_ink_daily_weather_refresh
  alias: E-Ink Daily Weather Refresh
  description: Store the daily forecast used by the overnight e-ink board.
  triggers:
    - at: 00:10:00
      trigger: time
    - event: start
      trigger: homeassistant
  actions:
    - action: weather.get_forecasts
      data:
        type: daily
      response_variable: daily_forecast
      target:
        entity_id: weather.forecast_housevoice_weather
    - variables:
        today: "{{ daily_forecast['weather.forecast_housevoice_weather']['forecast'][0]
          }}"
    - action: input_text.set_value
      data:
        value: "{{ today.condition | replace('-', ' ') | title }}"
      target:
        entity_id: input_text.e_ink_weather_condition
    - action: input_text.set_value
      data:
        value: "{{ today.temperature | string }}°"
      target:
        entity_id: input_text.e_ink_weather_high
    - action: input_text.set_value
      data:
        value: "{{ today.templow | string }}°"
      target:
        entity_id: input_text.e_ink_weather_low
  mode: restart

- id: housevoice_calendar_overflow_refresh
  alias: HouseVoice Calendar Overflow Refresh
  description: Store additional daily calendar events in overflow helpers
  triggers:
    - event: start
      trigger: homeassistant
    - minutes: /5
      trigger: time_pattern
    - entity_id: input_number.calendar_week_offset
      trigger: state
  actions:
    - action: calendar.get_events
      target:
        entity_id: calendar.kingsbury_mindy_gmail_com
      data:
        start_date_time: >-
          {{ today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7) }}
        end_date_time: >-
          {{ today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=14) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7) }}
      response_variable: family_calendar
    - repeat:
        for_each:
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_sun_events_2
            chunk_3: input_text.calendar_sun_events_3
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=1) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_mon_events_2
            chunk_3: input_text.calendar_mon_events_3
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=2) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_tue_events_2
            chunk_3: input_text.calendar_tue_events_3
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=3) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_wed_events_2
            chunk_3: input_text.calendar_wed_events_3
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=4) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_thu_events_2
            chunk_3: input_text.calendar_thu_events_3
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=5) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_fri_events_2
            chunk_3: input_text.calendar_fri_events_3
          - date: "{{ (today_at() - timedelta(days=(now().weekday() + 1) % 7) + timedelta(days=6) + timedelta(days=states('input_number.calendar_week_offset') | int(0) * 7)).strftime('%Y-%m-%d') }}"
            chunk_2: input_text.calendar_sat_events_2
            chunk_3: input_text.calendar_sat_events_3
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ repeat.item.chunk_2 }}"
            data:
              value: >-
                {% set ns = namespace(lines=[]) %}{% for event in family_calendar['calendar.kingsbury_mindy_gmail_com']['events'] | default([]) %}{% set start = event.start %}{% if start[:10] == repeat.item.date %}{% set when = 'All day' if start | length == 10 else (as_datetime(start) | as_local).strftime('%-I:%M %p') %}{% set title = event.summary | default('Untitled') | replace('|', '/') | replace('\n', ' ') | truncate(34, True, '...') %}{% set ns.lines = ns.lines + [title ~ '||' ~ when] %}{% endif %}{% endfor %}{{ ns.lines[5:10] | join('\n') }}
          - action: input_text.set_value
            target:
              entity_id: "{{ repeat.item.chunk_3 }}"
            data:
              value: >-
                {% set ns = namespace(lines=[]) %}{% for event in family_calendar['calendar.kingsbury_mindy_gmail_com']['events'] | default([]) %}{% set start = event.start %}{% if start[:10] == repeat.item.date %}{% set when = 'All day' if start | length == 10 else (as_datetime(start) | as_local).strftime('%-I:%M %p') %}{% set title = event.summary | default('Untitled') | replace('|', '/') | replace('\n', ' ') | truncate(34, True, '...') %}{% set ns.lines = ns.lines + [title ~ '||' ~ when] %}{% endif %}{% endfor %}{{ ns.lines[10:15] | join('\n') }}
  mode: restart
