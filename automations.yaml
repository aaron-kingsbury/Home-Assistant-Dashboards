- id: hallway_light_sync
  alias: Hallway Light Sync
  description: Sync hallway floorplan toggle with TP-Link smart switch
  triggers:
    - trigger: state
      entity_id: input_boolean.hall_light_mock
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.tp_link_smart_switch
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.tp_link_smart_switch
- id: hallway_light_sync_from_switch
  alias: Hallway Light Sync - Real Switch to Floorplan
  description: Update floorplan icon when the physical TP-Link switch changes
  triggers:
    - trigger: state
      entity_id: switch.tp_link_smart_switch
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.hall_light_mock
      default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.hall_light_mock
- id: right_bedroom_lock_sync_to_real
  alias: Right Bedroom Lock - Sync Floorplan to Real Lock
  description: Sync right bedroom floorplan lock toggle with Graham's door lock
  triggers:
    - trigger: state
      entity_id:
        - lock.grahams_door
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.grahams_door
      default:
        - action: lock.unlock
          target:
            entity_id: lock.grahams_door
- id: right_bedroom_lock_sync_from_real
  alias: Right Bedroom Lock - Sync Real Lock to Floorplan
  description: Update floorplan mock when Graham's door lock state changes
  triggers:
    - trigger: state
      entity_id: lock.grahams_door
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'locked' }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.right_bedroom_door_lock_mock
      default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.right_bedroom_door_lock_mock
- id: thermostat_hvac_dashboard_to_real
  alias: Thermostat HVAC Mode - Dashboard to Real
  description: Sync HVAC mode from dashboard controls to the real Honeywell thermostat
  triggers:
    - trigger: state
      entity_id: input_select.hvac_mode
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template:
                "{{ trigger.to_state.state == 'Cooling' and state_attr('climate.t6_pro_z_wave_programmable_thermostat',
                'hvac_mode') != 'cool' }}"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                hvac_mode: cool
        - conditions:
            - condition: template
              value_template:
                "{{ trigger.to_state.state == 'Heating' and state_attr('climate.t6_pro_z_wave_programmable_thermostat',
                'hvac_mode') != 'heat' }}"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                hvac_mode: heat
        - conditions:
            - condition: template
              value_template:
                "{{ trigger.to_state.state == 'Idle' and state_attr('climate.t6_pro_z_wave_programmable_thermostat',
                'hvac_mode') != 'off' }}"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.t6_pro_z_wave_programmable_thermostat
              data:
                hvac_mode: false
- id: thermostat_hvac_real_to_dashboard
  alias: Thermostat HVAC Mode - Real to Dashboard
  description: Sync real Honeywell thermostat HVAC mode changes back to the dashboard
    controls
  triggers:
    - trigger: state
      entity_id: climate.t6_pro_z_wave_programmable_thermostat
      attribute: hvac_mode
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'cool' and states('input_select.hvac_mode')
                != 'Cooling' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.hvac_mode
              data:
                option: Cooling
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'heat' and states('input_select.hvac_mode')
                != 'Heating' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.hvac_mode
              data:
                option: Heating
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'off' and states('input_select.hvac_mode')
                != 'Idle' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.hvac_mode
              data:
                option: Idle
- id: thermostat_temp_dashboard_to_real
  alias: Thermostat Temperature - Dashboard to Real
  description: Sync target temperature from dashboard controls to the real Honeywell
    thermostat
  triggers:
    - trigger: state
      entity_id: input_number.indoor_temperature
  actions:
    - condition: template
      value_template:
        "{{ trigger.to_state.state | float(0) != state_attr('climate.t6_pro_z_wave_programmable_thermostat',
        'temperature') | float(0) }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
      data:
        temperature: "{{ trigger.to_state.state | int }}"
- id: thermostat_temp_real_to_dashboard
  alias: Thermostat Temperature - Real to Dashboard
  description: Sync real Honeywell thermostat target temperature changes back to dashboard
    controls
  triggers:
    - trigger: state
      entity_id: climate.t6_pro_z_wave_programmable_thermostat
      attribute: temperature
  actions:
    - condition: template
      value_template: "{{ state_attr('climate.t6_pro_z_wave_programmable_thermostat',
        'temperature') | float(0) != states('input_number.indoor_temperature') |
        float(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.indoor_temperature
      data:
        value: "{{ state_attr('climate.t6_pro_z_wave_programmable_thermostat', 'temperature')
          | int }}"
- id: housevoice_panel_presence_manager
  alias: HouseVoice Panel Presence Manager
  description: Wake the panel on presence, start the standby countdown when presence
    clears
  mode: restart

  triggers:
    - trigger: state
      entity_id: input_boolean.housevoice_panel_mock_presence
      to: "on"
      id: presence_on
    - trigger: state
      entity_id: input_boolean.housevoice_panel_mock_presence
      to: "off"
      id: presence_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: presence_on
          sequence:
            - action: script.housevoice_panel_cancel_standby_countdown
            - action: script.housevoice_panel_wake
        - conditions:
            - condition: trigger
              id: presence_off
          sequence:
            - action: script.housevoice_panel_start_standby_countdown
- id: housevoice_panel_standby_timer_finished
  alias: HouseVoice Panel Standby Timer Finished
  description: Send the panel to Standby when the inactivity countdown completes
  mode: restart
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.housevoice_panel_standby
  actions:
    - action: script.housevoice_panel_sleep
- id: housevoice_kids_timer_finished_sound
  alias: HouseVoice Kids Timer Finished Sound
  description: Play three groups of three two-tone timer chimes at 80% volume, then
    restore the player volume
  triggers:
    - event_data:
        entity_id: timer.housevoice_kids_timer
      event_type: timer.finished
      trigger: event
  actions:
    - variables:
        previous_volume: '{{ state_attr("media_player.cora_s_room_display_media_player",
          "volume_level") | float(0.4) }}'
    - action: media_player.volume_set
      data:
        volume_level: 0.8
      target:
        entity_id: media_player.cora_s_room_display_media_player
    - action: music_assistant.play_announcement
      data:
        announce_volume: 80
        url: http://192.168.50.10:8123/local/housevoice/timer-two-tone-3x.wav
      target:
        entity_id: media_player.cora_s_room_display_media_player
    - delay: 00:00:08
    - action: media_player.volume_set
      data:
        volume_level: "{{ previous_volume }}"
      target:
        entity_id: media_player.cora_s_room_display_media_player
  mode: restart
- id: housevoice_panel_manual_hold_manager
  alias: HouseVoice Panel Manual Hold Manager
  description: Cancel the standby countdown while Manual Hold is on, restart it when
    released
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.housevoice_panel_manual_hold
      to: "on"
      id: hold_on
    - trigger: state
      entity_id: input_boolean.housevoice_panel_manual_hold
      to: "off"
      id: hold_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: hold_on
          sequence:
            - action: script.housevoice_panel_cancel_standby_countdown
        - conditions:
            - condition: trigger
              id: hold_off
          sequence:
            - action: script.housevoice_panel_start_standby_countdown
- id: housevoice_calendar_refresh
  alias: HouseVoice Calendar Refresh
  description: Fetch the current family calendar week for the HouseVoice calendar
    view.
  triggers:
    - event: start
      trigger: homeassistant
    - minutes: /5
      trigger: time_pattern
    - entity_id: input_number.calendar_week_offset
      trigger: state
  actions:
    - action: calendar.get_events
      data:
        end_date_time: "{{ week_end }}"
        start_date_time: "{{ week_start }}"
      response_variable: family_calendar
      target:
        entity_id: calendar.kingsbury_mindy_gmail_com
    - action: calendar.get_events
      data:
        end_date_time: "{{ today_at() + timedelta(days=1) }}"
