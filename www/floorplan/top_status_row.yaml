{
  "card_mod":
    {
      "style": "ha-card {\n  width: 100%;\n  max-width: 100%;\n  margin: 0 0 3px 0;\n  padding: 6px;\n  background: linear-gradient(180deg, rgba(5,18,31,0.72), rgba(4,14,25,0.58));\n  border: 1px solid rgba(95,145,185,0.18);\n  border-radius: 16px 16px 6px 6px;\n  box-shadow: 0 8px 24px rgba(0,0,0,0.24);\n  box-sizing: border-box;\n  overflow: hidden;\n}\n#root {\n  width: 100%;\n  display: grid !important;\n  grid-template-columns: minmax(0, 1.30fr) minmax(0, 1.00fr) minmax(0, 0.90fr) minmax(0, 1.00fr) minmax(0, 1.10fr) !important;\n  gap: 5px !important;\n  width: 100%;\n  padding: 0;\n  align-items: stretch;\n}",
    },
  "cards":
    [
      {
        "custom_fields":
          {
            "date": "[[[ const parts = (entity?.state || '').split(', '); const datePart = parts[0] || ''; const d = new Date(datePart + 'T12:00:00'); if (isNaN(d.getTime())) return ''; const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate(); ]]]",
            "time": "[[[ const parts = (entity?.state || '').split(', '); const timePart = parts[1] || '--:--'; const [h, m] = timePart.split(':').map(Number); const ampm = h >= 12 ? 'PM' : 'AM'; const h12 = h % 12 || 12; return h12 + ':' + String(m).padStart(2, '0') + ' ' + ampm; ]]]",
          },
        "entity": "sensor.date_time",
        "show_icon": false,
        "show_name": false,
        "show_state": false,
        "styles":
          {
            "card":
              [
                { "width": "100%" },
                { "height": "76px" },
                { "padding": "10px 12px" },
                { "border-radius": "11px" },
                { "background": "rgba(5,18,31,0.72)" },
                { "border": "1px solid rgba(95,145,185,0.10)" },
                { "box-shadow": "none" },
                { "min-width": "0" },
                { "border-right": "1px solid rgba(150,185,210,0.08)" },
              ],
            "custom_fields":
              {
                "date":
                  [
                    { "justify-self": "start" },
                    { "align-self": "start" },
                    { "font-size": "11px" },
                    { "color": "rgba(205,217,229,0.58)" },
                    { "margin-top": "2px" },
                  ],
                "time":
                  [
                    { "justify-self": "start" },
                    { "align-self": "end" },
                    { "font-size": "27px" },
                    { "font-weight": "400" },
                    { "color": "rgba(255,255,255,0.95)" },
                    { "line-height": "1" },
                    { "letter-spacing": "0.5px" },
                  ],
              },
            "grid":
              [
                { "grid-template-areas": '"time" "date"' },
                { "grid-template-columns": "1fr" },
                { "grid-template-rows": "1fr 1fr" },
                { "place-items": "start" },
