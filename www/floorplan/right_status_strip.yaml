                "style": ".hv-thermostat { width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; }\n.hv-dial { width: 76px; height: 76px; overflow: visible; }",
              },
            "custom_fields":
              {
                "dial": "[[[\n  const temp = entity?.state;\n  const mode = states['input_select.hvac_mode']?.state || 'Idle';\n\n  const numericTemp = Number(temp);\n  const displayTemp = Number.isFinite(numericTemp) ? `${Math.round(numericTemp)}°` : '--°';\n\n  const normalizedAction = mode === 'Cooling' ? 'Cooling' : mode === 'Heating' ? 'Heating' : 'Idle';\n\n  const accent = mode === 'Heating' ? '#FFD089' : mode === 'Cooling' ? '#58B9FF' : 'rgba(235,242,248,0.68)';\n  const glow = mode === 'Heating' ? 'rgba(255,208,137,0.35)' : mode === 'Cooling' ? 'rgba(88,185,255,0.35)' : 'rgba(220,232,242,0.12)';\n\n  const minTemp = 55;\n  const maxTemp = 85;\n  const clampedTemp = Number.isFinite(numericTemp) ? Math.min(maxTemp, Math.max(minTemp, numericTemp)) : minTemp;\n  const percentage = ((clampedTemp - minTemp) / (maxTemp - minTemp)) * 100;\n  const circumference = 188.5;\n  const progress = Math.max(12, Math.min(100, percentage));\n  const dash = (progress / 100) * circumference;\n\n  return `\n    <div class=\"hv-thermostat\">\n      <svg class=\"hv-dial\" viewBox=\"0 0 80 80\" aria-label=\"${displayTemp}, ${normalizedAction}\">\n        <circle cx=\"40\" cy=\"40\" r=\"30\" fill=\"rgba(5,18,31,0.38)\" stroke=\"rgba(190,215,235,0.14)\" stroke-width=\"5\" />\n        <circle cx=\"40\" cy=\"40\" r=\"30\" fill=\"none\" stroke=\"${accent}\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-dasharray=\"${dash} ${circumference - dash}\" transform=\"rotate(135 40 40)\" style=\"filter: drop-shadow(0 0 4px ${glow}) drop-shadow(0 0 8px ${glow});\" />\n        <text x=\"40\" y=\"40\" text-anchor=\"middle\" dominant-baseline=\"middle\" fill=\"rgba(255,255,255,0.96)\" font-size=\"18\" font-weight=\"500\">${displayTemp}</text>\n        <text x=\"40\" y=\"55\" text-anchor=\"middle\" fill=\"${accent}\" font-size=\"7.5\" font-weight=\"500\">${normalizedAction}</text>\n      </svg>\n    </div>\n  `;\n]]]",
              },
