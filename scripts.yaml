calendar_week_today:
  alias: "Calendar: This Week"
  mode: restart
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.calendar_week_offset
      data:
        value: 0
    - action: automation.trigger
      target:
        entity_id: automation.housevoice_calendar_refresh
calendar_week_previous:
  alias: "Calendar: Previous Week"
  mode: restart
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.calendar_week_offset
      data:
        value: "{{ [states('input_number.calendar_week_offset') | int(0) - 1, -4] | max }}"
    - action: automation.trigger
      target:
        entity_id: automation.housevoice_calendar_refresh
calendar_week_next:
  alias: "Calendar: Next Week"
  mode: restart
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.calendar_week_offset
      data:
        value: "{{ [states('input_number.calendar_week_offset') | int(0) + 1, 4] | min }}"
    - action: automation.trigger
      target:
        entity_id: automation.housevoice_calendar_refresh
