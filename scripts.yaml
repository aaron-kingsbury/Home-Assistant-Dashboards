housevoice_lights_day_mode:
  alias: "HouseVoice Lights: Day Mode"
  description: Set house lights to bright day mode
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.tp_link_smart_switch
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.primary_bedroom_light
          - input_boolean.small_bedroom_light
          - input_boolean.right_bedroom_light
          - input_boolean.hall_light_mock
          - input_boolean.kitchen_light_mock
          - input_boolean.living_room_light_mock
housevoice_lights_evening_mode:
  alias: "HouseVoice Lights: Evening Mode"
  description: Set warm evening mode
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.tp_link_smart_switch
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.primary_bedroom_light
          - input_boolean.small_bedroom_light
          - input_boolean.right_bedroom_light
          - input_boolean.hall_light_mock
          - input_boolean.kitchen_light_mock
          - input_boolean.living_room_light_mock
housevoice_lights_night_mode:
  alias: "HouseVoice Lights: Night Mode"
  description: Set low comfort night lighting
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.tp_link_smart_switch
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.primary_bedroom_light
          - input_boolean.small_bedroom_light
          - input_boolean.right_bedroom_light
          - input_boolean.hall_light_mock
          - input_boolean.kitchen_light_mock
          - input_boolean.living_room_light_mock
housevoice_lights_all_off:
  alias: "HouseVoice Lights: All Off"
  description: Turn off all house and exterior lights
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.tp_link_smart_switch
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.primary_bedroom_light
          - input_boolean.small_bedroom_light
          - input_boolean.right_bedroom_light
          - input_boolean.hall_light_mock
          - input_boolean.kitchen_light_mock
          - input_boolean.living_room_light_mock
    - action: light.turn_off
      target:
        entity_id:
          - light.driveway_floodlight
          - light.outside_back_yard_floodlight
housevoice_panel_wake:
  alias: HouseVoice Panel Wake
  mode: restart
  sequence:
    - action: timer.cancel
      target:
        entity_id: timer.housevoice_panel_standby
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.housevoice_panel_awake
    - action: browser_mod.navigate
      data:
        path: /my-floorplan
        browser_id:
          - housevoice-hall-panel
housevoice_panel_sleep:
  alias: HouseVoice Panel Sleep
  mode: restart
  sequence:
    - condition: state
      entity_id: input_boolean.housevoice_panel_manual_hold
      state: "off"
    - condition: state
      entity_id: input_boolean.housevoice_panel_mock_presence
      state: "off"
    - action: browser_mod.navigate
      data:
        path: /housevoice-standby/Standby
        browser_id:
          - housevoice-hall-panel
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.housevoice_panel_awake
housevoice_panel_start_standby_countdown:
  alias: HouseVoice Panel Start Standby Countdown
  mode: restart
  sequence:
    - condition: state
      entity_id: input_boolean.housevoice_panel_mock_presence
      state: "off"
    - condition: state
      entity_id: input_boolean.housevoice_panel_manual_hold
      state: "off"
    - action: timer.start
      target:
        entity_id: timer.housevoice_panel_standby
housevoice_panel_cancel_standby_countdown:
  alias: HouseVoice Panel Cancel Standby Countdown
  mode: restart
  sequence:
    - action: timer.cancel
      target:
        entity_id: timer.housevoice_panel_standby
