  sequence: []
housevoice_timer_start_selected:
  alias: "HouseVoice Timer: Start Selected Duration"
  description: Start the Kids Timer using the selected picker duration
  sequence:
    - action: timer.start
      target:
        entity_id: timer.housevoice_kids_timer
      data:
        duration: 00:{{ "%02d" | format(states("input_number.housevoice_timer_minutes") | int(0)) }}:{{ "%02d" | format(states("input_number.housevoice_timer_seconds") | int(0)) }}
housevoice_kids_morning:
  alias: "HouseVoice Kids: Morning"
  description: Turn on the small bedroom light at full brightness and stop room music
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.small_bedroom_light
    - action: input_number.set_value
      data:
        value: 100
      target:
        entity_id: input_number.housevoice_small_bedroom_brightness
    - action: media_player.turn_off
      target:
        entity_id: media_player.housevoice_kids_room
housevoice_kids_bedtime:
  alias: "HouseVoice Kids: Bedtime"
  description: Set the small bedroom light to 10%, start sleep sounds, and show a dim clock on Cora's display
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.small_bedroom_light
    - action: input_number.set_value
      data:
        value: 10
      target:
        entity_id: input_number.housevoice_small_bedroom_brightness
    - action: switch.turn_on
      target:
        entity_id:
          - switch.vaca_c958413a0_screen
          - switch.vaca_c958413a0_screen_always_on
    - action: switch.turn_off
      target:
        entity_id: switch.vaca_c958413a0_screen_saver
    - action: number.set_value
      target:
        entity_id: number.vaca_c958413a0_screen_brightness
      data:
        value: 10
    - action: view_assist.navigate
      data:
        device: sensor.vaca_c958413a0_current_path
        path: /kids-rooms/clock
        revert_timeout: 0
    - action: script.turn_on
      target:
        entity_id: script.housevoice_music_sleep_sounds
