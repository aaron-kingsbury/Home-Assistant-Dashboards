time:
  # PCF8563 is at I2C address 0x51 with a CR1220 coin cell backup.
  # On boot we read the RTC; when HA syncs, we write back to the RTC.
  # PCF8563 在 I2C 地址 0x51，由 CR1220 纽扣电池备份。
  # 启动时读取 RTC；当 HA 同步时间后，回写到 RTC。
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    # No periodic re-reads needed; HA sync handles it
    # 无需定期重读；HA 同步来处理
    update_interval: never

  - platform: homeassistant
    id: ha_time
    # When HA pushes a time sync, write it to the hardware RTC
    # 当 HA 推送时间同步时，写入硬件 RTC
    on_time_sync:
      then:
        - globals.set:
            id: housevoice_time_synced
            value: "true"
        - lambda: |-
            const auto now = id(ha_time).now();
            ESP_LOGI("housevoice", "Home Assistant time synchronized: %04d-%02d-%02d %02d:%02d:%02d",
                     now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
        - pcf8563.write_time:
        - logger.log: "Home Assistant time written to PCF8563 RTC"
        - script.execute: housevoice_check_initial_data

button:
  - platform: template
    name: "Refresh HouseVoice E-Ink"
    icon: "mdi:refresh"
    entity_category: config
    on_press:
      then:
        - component.update: epaper_display

# Home Assistant native API / Home Assistant 原生 API
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - globals.set:
        id: housevoice_api_connected
        value: "true"
    - logger.log: "Home Assistant API connected; waiting for HouseVoice data"
    - script.execute: housevoice_check_initial_data
  on_client_disconnected:
    - globals.set:
        id: housevoice_api_connected
        value: "false"

# OTA (Over-The-Air) firmware update / 空中固件更新
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi settings / Wi-Fi 设置
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-E1002"
    password: !secret reterminal_ap_password

captive_portal:

# =============================================================================
# [1] ePaper display (7.5" COLOR, 800x480)
# 墨水屏（7.5 英寸彩色，800×480）
# Requires ESPHome >= 2025.11.1 / 需要 ESPHome >= 2025.11.1
# =============================================================================

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto WHITE = Color(255, 255, 255, 0);
      const auto BLACK = Color(0, 0, 0, 0);
      const auto RED = Color(255, 0, 0, 0);
      const auto GREEN = Color(0, 255, 0, 0);
      const auto BLUE = Color(0, 0, 255, 0);
      const auto YELLOW = Color(255, 255, 0, 0);

      it.image(0, 0, id(housevoice_background_white), WHITE, BLACK);
      it.image(0, 0, id(housevoice_background_black), BLACK, WHITE);
      it.image(0, 0, id(housevoice_background_red), RED, WHITE);
      it.image(0, 0, id(housevoice_background_green), GREEN, WHITE);
      it.image(0, 0, id(housevoice_background_blue), BLUE, WHITE);
      it.image(0, 0, id(housevoice_background_yellow), YELLOW, WHITE);

      auto draw_time = [&](const std::string &value, int y) {
        if (value.empty()) {
          it.printf(735, y, id(font_rail), BLACK, TextAlign::TOP_CENTER, "--:--");
          return;
        }
        it.printf(735, y, id(font_rail), BLACK, TextAlign::TOP_CENTER, "%s", value.c_str());
      };

      auto local_sun_time = [](const std::string &value) {
        if (value.size() < 19) return std::string("--:--");
        char timestamp[20];
        memcpy(timestamp, value.c_str(), 19);
        timestamp[10] = ' ';
        timestamp[19] = '\0';
        esphome::ESPTime utc;
        if (!esphome::ESPTime::strptime(timestamp, utc)) return std::string("--:--");
        utc.recalc_timestamp_utc(false);
        if (utc.timestamp == -1) return std::string("--:--");
        const auto local = esphome::ESPTime::from_epoch_local(utc.timestamp);
        const int display_hour = local.hour % 12 == 0 ? 12 : local.hour % 12;
        const char *period = local.hour >= 12 ? "PM" : "AM";
        char formatted[12];
        snprintf(formatted, sizeof(formatted), "%d:%02d %s", display_hour, local.minute, period);
        return std::string(formatted);
      };

      auto draw_events = [&](const std::string &raw, int x, int max_title_chars) {
        int row = 0;
        size_t cursor = 0;
        while (row < 4 && cursor < raw.size()) {
          size_t line_end = raw.find('\n', cursor);
          if (line_end == std::string::npos) line_end = raw.size();
          std::string line = raw.substr(cursor, line_end - cursor);
          cursor = line_end == raw.size() ? raw.size() : line_end + 1;
          if (line.empty()) continue;

          size_t separator = line.find("||");
          std::string title = separator == std::string::npos ? line : line.substr(0, separator);
          std::string when = separator == std::string::npos ? "All day" : line.substr(separator + 2);
          if (title.empty()) title = "Untitled";
          if (when.empty()) when = "All day";
          std::string first_line = title;
          std::string second_line;
          if (title.size() > static_cast<size_t>(max_title_chars)) {
            size_t split = title.rfind(' ', max_title_chars);
            if (split == std::string::npos || split == 0) split = max_title_chars;
            first_line = title.substr(0, split);
            size_t remainder_start = split;
            while (remainder_start < title.size() && title[remainder_start] == ' ') {
              remainder_start++;
            }
            second_line = title.substr(remainder_start);
            if (second_line.size() > static_cast<size_t>(max_title_chars)) {
              second_line = second_line.substr(0, max_title_chars - 3) + "...";
            }
          }

          const int y = 223 + row * 28;
          it.printf(x, y, id(font_event_time), BLUE, TextAlign::TOP_LEFT, "%s", when.c_str());
          it.printf(x + 65, y, id(font_event_title), BLACK, TextAlign::TOP_LEFT, "%s", first_line.c_str());
          if (!second_line.empty()) {
            it.printf(x + 65, y + 11, id(font_event_title), BLACK, TextAlign::TOP_LEFT,
                      "%s", second_line.c_str());
          }
          row++;
        }
      };

       auto now = id(ha_time).now();
       if (now.is_valid() && now.year >= 2025 && now.year <= 2100) {
        char date_text[48];
        now.strftime(date_text, sizeof(date_text), "%A, %B %d, %Y");
        for (char *character = date_text; *character != '\0'; character++) {
          if (*character >= 'a' && *character <= 'z') *character -= 'a' - 'A';
        }
        it.printf(407, 132, id(font_date), BLACK, TextAlign::TOP_CENTER, "%s", date_text);
      } else {
        it.printf(407, 132, id(font_date), BLACK, TextAlign::TOP_CENTER, "WAITING FOR DATE");
      }

       draw_events(id(calendar_today_events).state, 237, 16);

       int weekday = now.is_valid() ? now.day_of_week : 1;
       weekday = weekday == 1 ? 0 : weekday - 1;
       const int tomorrow = (weekday + 1) % 7;
       const char *tomorrow_sensor = "calendar_sun_events";
       const std::string *tomorrow_events = &id(calendar_sun_events).state;
       if (tomorrow == 1) {
         tomorrow_sensor = "calendar_mon_events";
         tomorrow_events = &id(calendar_mon_events).state;
       } else if (tomorrow == 2) {
         tomorrow_sensor = "calendar_tue_events";
         tomorrow_events = &id(calendar_tue_events).state;
       } else if (tomorrow == 3) {
         tomorrow_sensor = "calendar_wed_events";
         tomorrow_events = &id(calendar_wed_events).state;
       } else if (tomorrow == 4) {
         tomorrow_sensor = "calendar_thu_events";
         tomorrow_events = &id(calendar_thu_events).state;
       } else if (tomorrow == 5) {
         tomorrow_sensor = "calendar_fri_events";
         tomorrow_events = &id(calendar_fri_events).state;
       } else if (tomorrow == 6) {
         tomorrow_sensor = "calendar_sat_events";
         tomorrow_events = &id(calendar_sat_events).state;
       }
       ESP_LOGI("housevoice", "[HouseVoice Render] date=%04d-%02d-%02d today_len=%u tomorrow=%s tomorrow_len=%u condition=\"%s\" high=\"%s\" low=\"%s\" sunrise=\"%s\" sunset=\"%s\"",
                now.year, now.month, now.day_of_month,
                static_cast<unsigned>(id(calendar_today_events).state.size()), tomorrow_sensor,
                static_cast<unsigned>(tomorrow_events->size()), id(weather_condition).state.c_str(),
                id(weather_high).state.c_str(), id(weather_low).state.c_str(),
                id(sunrise).state.c_str(), id(sunset).state.c_str());
       draw_events(*tomorrow_events, 435, 19);

      std::string condition = id(weather_condition).state;
      std::string normalized = condition;
      for (char &character : normalized) {
        if (character == '_') character = '-';
        if (character >= 'A' && character <= 'Z') character += 'a' - 'A';
      }
      const char *condition_label = normalized.c_str();
      if (normalized == "sunny") condition_label = "Sunny";
      else if (normalized == "clear" || normalized == "clear-night") condition_label = "Clear";
      else if (normalized == "partlycloudy" || normalized == "partly-cloudy") condition_label = "Partly Cloudy";
      else if (normalized == "cloudy") condition_label = "Cloudy";
      else if (normalized == "rainy" || normalized == "pouring") condition_label = "Rainy";
      else if (normalized == "snowy" || normalized == "snowy-rainy") condition_label = "Snow";
      it.printf(710, 175, id(font_condition), BLACK, TextAlign::TOP_CENTER, "%s", condition_label);

      it.printf(672, 268, id(font_temperature), BLUE, TextAlign::TOP_CENTER,
                "%s", id(weather_high).state.c_str());
      it.printf(747, 268, id(font_temperature), BLACK, TextAlign::TOP_CENTER,
                "%s", id(weather_low).state.c_str());

      const std::string sunrise_local = local_sun_time(id(sunrise).state);
      const std::string sunset_local = local_sun_time(id(sunset).state);
      draw_time(sunrise_local, 54);
      draw_time(sunset_local, 132);

# secrets.yaml (create this file alongside your config):
# wifi_ssid: "Your WiFi SSID"
# wifi_password: "Your WiFi Password"
# ota_password: "choose-a-strong-password"
# api_encryption_key: "generate with: openssl rand -base64 32"
