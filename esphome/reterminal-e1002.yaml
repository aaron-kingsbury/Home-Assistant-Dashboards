# SPI — shared by ePaper display and SD card
# SPI — 墨水屏和 SD 卡共用
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9

# I2C — shared by SHT4x sensor, PCF8563 RTC
# I2C — SHT4x 传感器和 PCF8563 实时时钟共用
i2c:
  scl: GPIO20
  sda: GPIO19

output:
  # [5] Battery measurement enable / 电池测量使能
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  # --- Battery voltage (ADC on GPIO1) ---
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      # Compensate for onboard voltage divider (1:2)
      # 补偿板载分压电阻（1:2 比例）
      - multiply: 2.0

  # --- Battery level (percentage) ---
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: "return id(battery_voltage).state;"
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

globals:
  - id: housevoice_api_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: housevoice_time_synced
    type: bool
    restore_value: false
    initial_value: "false"
  - id: housevoice_initial_refresh_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: housevoice_last_readiness
    type: uint16_t
    restore_value: false
    initial_value: "65535"
  - id: housevoice_all_data_ready_logged
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: housevoice_check_initial_data
    mode: single
    then:
      - lambda: |-
          auto calendar_summary = [](const std::string &value) {
            std::string preview = value.substr(0, 48);
            for (char &character : preview) {
              if (character == '\n') character = '|';
            }
            std::string result = "len=";
            result += std::to_string(value.size());
            result += " | empty=";
            result += value.empty() ? "true" : "false";
            result += " | preview=";
            result += preview;
            return result;
          };
          id(debug_calendar_today).publish_state(calendar_summary(id(calendar_today_events).state));
          id(debug_calendar_sun).publish_state(calendar_summary(id(calendar_sun_events).state));
          id(debug_calendar_mon).publish_state(calendar_summary(id(calendar_mon_events).state));
          id(debug_calendar_tue).publish_state(calendar_summary(id(calendar_tue_events).state));
          id(debug_calendar_wed).publish_state(calendar_summary(id(calendar_wed_events).state));
          id(debug_calendar_thu).publish_state(calendar_summary(id(calendar_thu_events).state));
          id(debug_calendar_fri).publish_state(calendar_summary(id(calendar_fri_events).state));
          id(debug_calendar_sat).publish_state(calendar_summary(id(calendar_sat_events).state));
          id(debug_weather_condition).publish_state(id(weather_condition).state);
          id(debug_weather_high).publish_state(id(weather_high).state);
          id(debug_weather_low).publish_state(id(weather_low).state);
          id(debug_sunrise).publish_state(id(sunrise).state);
          id(debug_sunset).publish_state(id(sunset).state);
          const bool data_ready = id(calendar_today_events).has_state() &&
              id(calendar_sun_events).has_state() && id(calendar_mon_events).has_state() &&
              id(calendar_tue_events).has_state() && id(calendar_wed_events).has_state() &&
              id(calendar_thu_events).has_state() && id(calendar_fri_events).has_state() &&
              id(calendar_sat_events).has_state() && !id(weather_condition).state.empty() &&
              !id(weather_high).state.empty() && !id(weather_low).state.empty() &&
              !id(sunrise).state.empty() && !id(sunset).state.empty();
          char readiness[96];
          snprintf(readiness, sizeof(readiness), "api=%s | time=%s | data=%s | mask=%u",
                   id(housevoice_api_connected) ? "true" : "false",
                   id(housevoice_time_synced) ? "true" : "false",
                   data_ready ? "true" : "false", id(housevoice_last_readiness));
          id(debug_readiness).publish_state(readiness);
      - lambda: |-
          const bool time_ready = id(housevoice_time_synced);
          const bool today_ready = id(calendar_today_events).has_state();
          const bool tomorrow_ready = id(calendar_sun_events).has_state() ||
              id(calendar_mon_events).has_state() || id(calendar_tue_events).has_state() ||
              id(calendar_wed_events).has_state() || id(calendar_thu_events).has_state() ||
              id(calendar_fri_events).has_state() || id(calendar_sat_events).has_state();
          const bool condition_ready = !id(weather_condition).state.empty();
          const bool high_ready = !id(weather_high).state.empty();
          const bool low_ready = !id(weather_low).state.empty();
          const bool sunrise_ready = !id(sunrise).state.empty();
          const bool sunset_ready = !id(sunset).state.empty();
          const uint16_t readiness =
              (time_ready ? 1 : 0) | (today_ready ? 2 : 0) | (tomorrow_ready ? 4 : 0) |
              (condition_ready ? 8 : 0) | (high_ready ? 16 : 0) | (low_ready ? 32 : 0) |
              (sunrise_ready ? 64 : 0) | (sunset_ready ? 128 : 0);
          if (readiness != id(housevoice_last_readiness)) {
            ESP_LOGI("housevoice", "HouseVoice readiness: time=%s today=%s tomorrow=%s condition=%s high=%s low=%s sunrise=%s sunset=%s",
                     time_ready ? "true" : "false", today_ready ? "true" : "false",
                     tomorrow_ready ? "true" : "false", condition_ready ? "true" : "false",
                     high_ready ? "true" : "false", low_ready ? "true" : "false",
                     sunrise_ready ? "true" : "false", sunset_ready ? "true" : "false");
            id(housevoice_last_readiness) = readiness;
          }
          if (readiness == 255 && !id(housevoice_all_data_ready_logged)) {
            ESP_LOGI("housevoice", "ALL DATA READY; waiting 2 seconds before one-shot display refresh");
            id(housevoice_all_data_ready_logged) = true;
          }
      - lambda: |-
          const bool data_ready = id(calendar_today_events).has_state() &&
              id(calendar_sun_events).has_state() && id(calendar_mon_events).has_state() &&
              id(calendar_tue_events).has_state() && id(calendar_wed_events).has_state() &&
              id(calendar_thu_events).has_state() && id(calendar_fri_events).has_state() &&
              id(calendar_sat_events).has_state() && !id(weather_condition).state.empty() &&
              !id(weather_high).state.empty() && !id(weather_low).state.empty() &&
              !id(sunrise).state.empty() && !id(sunset).state.empty();
          char readiness[96];
          snprintf(readiness, sizeof(readiness), "api=%s | time=%s | data=%s | mask=%u",
                   id(housevoice_api_connected) ? "true" : "false",
                   id(housevoice_time_synced) ? "true" : "false",
                   data_ready ? "true" : "false", id(housevoice_last_readiness));
          id(debug_readiness).publish_state(readiness);
      - if:
          condition:
            lambda: |-
              if (id(housevoice_initial_refresh_done) || !id(housevoice_api_connected) || !id(housevoice_time_synced)) {
                return false;
              }
              if (!id(calendar_today_events).has_state() ||
                  !id(calendar_sun_events).has_state() ||
                  !id(calendar_mon_events).has_state() ||
                  !id(calendar_tue_events).has_state() ||
                  !id(calendar_wed_events).has_state() ||
                  !id(calendar_thu_events).has_state() ||
                  !id(calendar_fri_events).has_state() ||
                  !id(calendar_sat_events).has_state() ||
                  id(weather_condition).state.empty() ||
                  id(weather_high).state.empty() ||
                  id(weather_low).state.empty() ||
                  id(sunrise).state.empty() ||
                  id(sunset).state.empty()) {
                return false;
              }
              return true;
          then:
            - delay: 2s
            - if:
                condition:
                  lambda: |-
                    return !id(housevoice_initial_refresh_done) &&
                        id(housevoice_api_connected) && id(housevoice_time_synced) &&
                        id(calendar_today_events).has_state() &&
                        id(calendar_sun_events).has_state() &&
                        id(calendar_mon_events).has_state() &&
                        id(calendar_tue_events).has_state() &&
                        id(calendar_wed_events).has_state() &&
                        id(calendar_thu_events).has_state() &&
                        id(calendar_fri_events).has_state() &&
                        id(calendar_sat_events).has_state() &&
                        !id(weather_condition).state.empty() &&
                        !id(weather_high).state.empty() &&
                        !id(weather_low).state.empty() && !id(sunrise).state.empty() &&
                        !id(sunset).state.empty();
                then:
                  - globals.set:
                      id: housevoice_initial_refresh_done
                      value: "true"
                  - lambda: |-
                      const auto now = id(ha_time).now();
                      ESP_LOGI("housevoice", "HouseVoice data ready: date=%04d-%02d-%02d today_len=%u weather=%s high=%s low=%s sunrise=%s sunset=%s",
                               now.year, now.month, now.day_of_month,
                               static_cast<unsigned>(id(calendar_today_events).state.size()),
                               id(weather_condition).state.c_str(), id(weather_high).state.c_str(),
                               id(weather_low).state.c_str(), id(sunrise).state.c_str(),
                               id(sunset).state.c_str());
                      ESP_LOGI("housevoice", "[HouseVoice] DATA READY - PERFORMING INITIAL DISPLAY REFRESH");
                  - component.update: epaper_display

