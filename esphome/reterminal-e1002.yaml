# =============================================================================
# reTerminal E1002 — ESPHome Full Hardware Example
# All onboard peripherals enabled in the most basic way
# reTerminal E1002 — ESPHome 全硬件基础示例
# 以最基本的方式启用板载所有外设
# =============================================================================
#
# Hardware list / 硬件清单:
#   1. 7.5" COLOR ePaper display (800x480, SPI)    / 7.5 英寸彩色墨水屏
#      Supported colors: BLACK, RED, GREEN, BLUE, YELLOW
#      支持颜色：黑、红、绿、蓝、黄
#   2. 3x buttons (GPIO3, GPIO4, GPIO5)            / 3 个按钮
#   3. Buzzer (GPIO45, PWM)                         / 蜂鸣器
#   4. Onboard LED (GPIO6)                          / 板载 LED
#   5. Battery voltage (GPIO1 ADC + GPIO21 EN)      / 电池电压监测
#   6. SHT4x temp & humidity sensor (I2C)           / SHT4x 温湿度传感器
#   7. PCF8563 RTC (I2C addr 0x51, CR1220 backup)   / PCF8563 实时时钟
#   8. PDM Microphone (CLK=42, DATA=41, EN=38)      / PDM 麦克风
#   9. MicroSD card slot (SPI + DET=15, EN=16)      / MicroSD 卡槽
#  10. Deep sleep with button wake-up                / 深度睡眠 + 按钮唤醒
#
# NOTE: Requires ESPHome >= 2025.11.1 for epaper_spi platform
# 注意：需要 ESPHome >= 2025.11.1 才能使用 epaper_spi 平台
#
# Serial debug: UART0 via CH340K USB bridge
# 串口调试：通过 CH340K USB 桥接芯片走 UART0
# =============================================================================
substitutions:
  device_name: reterminal-e1002
  friendly_name: "reTerminal_E1002"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      # Turn on battery measurement circuit / 打开电池测量电路
      - output.turn_on: bsp_battery_enable
      # Wait for voltages to stabilize / 等待电压稳定
      - delay: 200ms
      # Take first battery reading / 采集首次电池读数
      - component.update: battery_voltage
      - component.update: battery_level
      # Read RTC time on boot / 启动时读取 RTC 时间
      - pcf8563.read_time:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable serial logging / 启用串口日志
# The reTerminal E series has a CH340K USB-to-UART bridge on UART0.
# Default ESP32-S3 logger uses USB_CDC — won't produce output on the physical port.
# reTerminal E 系列板载 CH340K 桥接芯片，串口走 UART0，非默认的 USB_CDC。
logger:
  hardware_uart: UART0

# =============================================================================
# Fonts / 字体
# =============================================================================

font:
  - file: "gfonts://Lora@400"
    id: font_date
    size: 16
  - file: "gfonts://Lora@400"
    id: font_event_title
    size: 10
  - file: "gfonts://Inter@700"
    id: font_event_time
    size: 12
  - file: "gfonts://Lora@400"
    id: font_rail
    size: 15
  - file: "gfonts://Lora@400"
    id: font_condition
    size: 18
  - file: "gfonts://Lora@700"
    id: font_temperature
    size: 34

image:
  - platform: file
    defaults:
      type: BINARY
      transparency: chroma_key
    files:
      - id: housevoice_background_white
        file: "../www/housevoice/assets/references/e-ink-background-8-800x480/mask-white.png"
      - id: housevoice_background_black
        file: "../www/housevoice/assets/references/e-ink-background-8-800x480/mask-black.png"
      - id: housevoice_background_red
        file: "../www/housevoice/assets/references/e-ink-background-8-800x480/mask-red.png"
      - id: housevoice_background_green
        file: "../www/housevoice/assets/references/e-ink-background-8-800x480/mask-green.png"
      - id: housevoice_background_blue
        file: "../www/housevoice/assets/references/e-ink-background-8-800x480/mask-blue.png"
      - id: housevoice_background_yellow
        file: "../www/housevoice/assets/references/e-ink-background-8-800x480/mask-yellow.png"

# SPI — shared by ePaper display and SD card
# SPI — 墨水屏和 SD 卡共用
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9

# I2C — shared by SHT4x sensor, PCF8563 RTC
# I2C — SHT4x 传感器和 PCF8563 实时时钟共用
i2c:
  scl: GPIO20
  sda: GPIO19

output:
  # [5] Battery measurement enable / 电池测量使能
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  # --- Battery voltage (ADC on GPIO1) ---
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      # Compensate for onboard voltage divider (1:2)
      # 补偿板载分压电阻（1:2 比例）
      - multiply: 2.0

  # --- Battery level (percentage) ---
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: "return id(battery_voltage).state;"
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

globals:
  - id: housevoice_api_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: housevoice_time_synced
    type: bool
    restore_value: false
    initial_value: "false"
  - id: housevoice_initial_refresh_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: housevoice_initial_refresh_timeout
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: housevoice_check_initial_data
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (id(housevoice_initial_refresh_done) || !id(housevoice_api_connected) || !id(housevoice_time_synced)) {
                return false;
              }
              if (!id(calendar_today_events).has_state() ||
                  !id(calendar_sun_events).has_state() ||
                  !id(calendar_mon_events).has_state() ||
                  !id(calendar_tue_events).has_state() ||
                  !id(calendar_wed_events).has_state() ||
                  !id(calendar_thu_events).has_state() ||
                  !id(calendar_fri_events).has_state() ||
                  !id(calendar_sat_events).has_state() ||
                  id(weather_condition).state.empty() ||
                  id(weather_high).state.empty() ||
                  id(weather_low).state.empty() ||
                  id(sunrise).state.empty() ||
                  id(sunset).state.empty()) {
                return id(housevoice_initial_refresh_timeout);
              }
              return true;
          then:
            - globals.set:
                id: housevoice_initial_refresh_done
                value: "true"
            - lambda: |-
                const auto now = id(ha_time).now();
                ESP_LOGI("housevoice", "HouseVoice data ready: date=%04d-%02d-%02d today_len=%u weather=%s high=%s low=%s sunrise=%s sunset=%s",
                         now.year, now.month, now.day_of_month,
                         static_cast<unsigned>(id(calendar_today_events).state.size()),
                         id(weather_condition).state.c_str(), id(weather_high).state.c_str(),
                         id(weather_low).state.c_str(), id(sunrise).state.c_str(),
                         id(sunset).state.c_str());
            - component.update: epaper_display

text_sensor:
  - platform: homeassistant
    id: calendar_today_events
    entity_id: input_text.calendar_today_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_sun_events
    entity_id: input_text.calendar_sun_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_mon_events
    entity_id: input_text.calendar_mon_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_tue_events
    entity_id: input_text.calendar_tue_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_wed_events
    entity_id: input_text.calendar_wed_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_thu_events
    entity_id: input_text.calendar_thu_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_fri_events
    entity_id: input_text.calendar_fri_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: calendar_sat_events
    entity_id: input_text.calendar_sat_events
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: weather_condition
    entity_id: input_text.e_ink_weather_condition
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: weather_high
    entity_id: input_text.e_ink_weather_high
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: weather_low
    entity_id: input_text.e_ink_weather_low
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: sunrise
    entity_id: sun.sun
    attribute: next_rising
    on_value:
      then:
        - script.execute: housevoice_check_initial_data
  - platform: homeassistant
    id: sunset
    entity_id: sun.sun
    attribute: next_setting
    on_value:
      then:
        - script.execute: housevoice_check_initial_data

binary_sensor:
  # KEY0 (GPIO3)
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT
      inverted: true
    id: button_1
    name: "KEY0 Right Green Button"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - logger.log: "KEY0 (GPIO3) pressed"
        - component.update: epaper_display

  # KEY1 (GPIO4)
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT
      inverted: true
    id: button_2
    name: "KEY1 Middle Button"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - logger.log: "KEY1 (GPIO4) pressed"

  # KEY2 (GPIO5)
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT
      inverted: true
    id: button_3
    name: "KEY2 Left Button"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - logger.log: "KEY2 (GPIO5) pressed"

time:
  # PCF8563 is at I2C address 0x51 with a CR1220 coin cell backup.
  # On boot we read the RTC; when HA syncs, we write back to the RTC.
  # PCF8563 在 I2C 地址 0x51，由 CR1220 纽扣电池备份。
  # 启动时读取 RTC；当 HA 同步时间后，回写到 RTC。
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    # No periodic re-reads needed; HA sync handles it
    # 无需定期重读；HA 同步来处理
    update_interval: never

  - platform: homeassistant
    id: ha_time
    # When HA pushes a time sync, write it to the hardware RTC
    # 当 HA 推送时间同步时，写入硬件 RTC
    on_time_sync:
      then:
        - globals.set:
            id: housevoice_time_synced
            value: "true"
        - lambda: |-
            const auto now = id(ha_time).now();
            ESP_LOGI("housevoice", "Home Assistant time synchronized: %04d-%02d-%02d %02d:%02d:%02d",
                     now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
        - pcf8563.write_time:
        - logger.log: "Home Assistant time written to PCF8563 RTC"
        - script.execute: housevoice_check_initial_data

button:
  - platform: template
    name: "Refresh HouseVoice E-Ink"
    icon: "mdi:refresh"
    entity_category: config
    on_press:
      then:
        - component.update: epaper_display

# Home Assistant native API / Home Assistant 原生 API
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - globals.set:
        id: housevoice_api_connected
        value: "true"
    - logger.log: "Home Assistant API connected; waiting for HouseVoice data"
    - script.execute: housevoice_check_initial_data
    - delay: 60s
    - globals.set:
        id: housevoice_initial_refresh_timeout
        value: "true"
    - script.execute: housevoice_check_initial_data
  on_client_disconnected:
    - globals.set:
        id: housevoice_api_connected
        value: "false"

# OTA (Over-The-Air) firmware update / 空中固件更新
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi settings / Wi-Fi 设置
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-E1002"
    password: !secret reterminal_ap_password

captive_portal:

# =============================================================================
# [1] ePaper display (7.5" COLOR, 800x480)
# 墨水屏（7.5 英寸彩色，800×480）
# Requires ESPHome >= 2025.11.1 / 需要 ESPHome >= 2025.11.1
# =============================================================================

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto WHITE = Color(255, 255, 255, 0);
      const auto BLACK = Color(0, 0, 0, 0);
      const auto RED = Color(255, 0, 0, 0);
      const auto GREEN = Color(0, 255, 0, 0);
      const auto BLUE = Color(0, 0, 255, 0);
      const auto YELLOW = Color(255, 255, 0, 0);

      it.image(0, 0, id(housevoice_background_white), WHITE, BLACK);
      it.image(0, 0, id(housevoice_background_black), BLACK, WHITE);
      it.image(0, 0, id(housevoice_background_red), RED, WHITE);
      it.image(0, 0, id(housevoice_background_green), GREEN, WHITE);
      it.image(0, 0, id(housevoice_background_blue), BLUE, WHITE);
      it.image(0, 0, id(housevoice_background_yellow), YELLOW, WHITE);

      auto draw_time = [&](const std::string &value, int y) {
        if (value.size() < 16) {
          it.printf(735, y, id(font_rail), BLACK, TextAlign::TOP_CENTER, "--:--");
          return;
        }
        const int hour = (value[11] - '0') * 10 + (value[12] - '0');
        const int minute = (value[14] - '0') * 10 + (value[15] - '0');
        const bool pm = hour >= 12;
        const int display_hour = hour % 12 == 0 ? 12 : hour % 12;
        it.printf(735, y, id(font_rail), BLACK, TextAlign::TOP_CENTER,
                  "%d:%02d %s", display_hour, minute, pm ? "PM" : "AM");
      };

      auto draw_events = [&](const std::string &raw, int x, int max_title_chars) {
        int row = 0;
        size_t cursor = 0;
        while (row < 4 && cursor < raw.size()) {
          size_t line_end = raw.find('\n', cursor);
          if (line_end == std::string::npos) line_end = raw.size();
          std::string line = raw.substr(cursor, line_end - cursor);
          cursor = line_end == raw.size() ? raw.size() : line_end + 1;
          if (line.empty()) continue;

          size_t separator = line.find("||");
          std::string title = separator == std::string::npos ? line : line.substr(0, separator);
          std::string when = separator == std::string::npos ? "All day" : line.substr(separator + 2);
          if (title.empty()) title = "Untitled";
          if (when.empty()) when = "All day";
          if (title.size() > static_cast<size_t>(max_title_chars)) {
            title = title.substr(0, max_title_chars - 3) + "...";
          }

          const int y = 223 + row * 28;
          it.printf(x, y, id(font_event_time), BLUE, TextAlign::TOP_LEFT, "%s", when.c_str());
          it.printf(x + 65, y, id(font_event_title), BLACK, TextAlign::TOP_LEFT, "%s", title.c_str());
          row++;
        }
      };

      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        char date_text[48];
        now.strftime(date_text, sizeof(date_text), "%A, %B %d, %Y");
        for (char *character = date_text; *character != '\0'; character++) {
          if (*character >= 'a' && *character <= 'z') *character -= 'a' - 'A';
        }
        it.printf(407, 132, id(font_date), BLACK, TextAlign::TOP_CENTER, "%s", date_text);
      } else {
        it.printf(407, 132, id(font_date), BLACK, TextAlign::TOP_CENTER, "WAITING FOR DATE");
      }

      draw_events(id(calendar_today_events).state, 237, 16);

      int weekday = now.is_valid() ? now.day_of_week : 1;
      weekday = weekday == 1 ? 0 : weekday - 1;
      const int tomorrow = (weekday + 1) % 7;
      if (tomorrow == 0) draw_events(id(calendar_sun_events).state, 435, 19);
      if (tomorrow == 1) draw_events(id(calendar_mon_events).state, 435, 19);
      if (tomorrow == 2) draw_events(id(calendar_tue_events).state, 435, 19);
      if (tomorrow == 3) draw_events(id(calendar_wed_events).state, 435, 19);
      if (tomorrow == 4) draw_events(id(calendar_thu_events).state, 435, 19);
      if (tomorrow == 5) draw_events(id(calendar_fri_events).state, 435, 19);
      if (tomorrow == 6) draw_events(id(calendar_sat_events).state, 435, 19);

      std::string condition = id(weather_condition).state;
      std::string normalized = condition;
      for (char &character : normalized) {
        if (character == '_') character = '-';
        if (character >= 'A' && character <= 'Z') character += 'a' - 'A';
      }
      const char *condition_label = normalized.c_str();
      if (normalized == "sunny") condition_label = "Sunny";
      else if (normalized == "clear" || normalized == "clear-night") condition_label = "Clear";
      else if (normalized == "partlycloudy" || normalized == "partly-cloudy") condition_label = "Partly Cloudy";
      else if (normalized == "cloudy") condition_label = "Cloudy";
      else if (normalized == "rainy" || normalized == "pouring") condition_label = "Rainy";
      else if (normalized == "snowy" || normalized == "snowy-rainy") condition_label = "Snow";
      it.printf(710, 175, id(font_condition), BLACK, TextAlign::TOP_CENTER, "%s", condition_label);

      it.printf(672, 268, id(font_temperature), BLUE, TextAlign::TOP_CENTER,
                "%s", id(weather_high).state.c_str());
      it.printf(747, 268, id(font_temperature), BLACK, TextAlign::TOP_CENTER,
                "%s", id(weather_low).state.c_str());

      draw_time(id(sunrise).state, 54);
      draw_time(id(sunset).state, 132);

# secrets.yaml (create this file alongside your config):
# wifi_ssid: "Your WiFi SSID"
# wifi_password: "Your WiFi Password"
# ota_password: "choose-a-strong-password"
# api_encryption_key: "generate with: openssl rand -base64 32"
